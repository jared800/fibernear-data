name: Egress probe

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        run: python scripts/probe_sources.py
      - name: Commit results
        run: |
          git config user.name  "fibernear-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "probe: refresh source reachability report"
          git push
